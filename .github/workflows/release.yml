name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: "Release tag to build (for example v4.1.0)"
        required: true
        default: "v4.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.0.0-alpha2.117
  TASK_VERSION: v3.40.1

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve semver
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CUSTOM_TAG: ${{ inputs.custom_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
          else
            tag="${CUSTOM_TAG:-}"
          fi
          tag="v${tag#v}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$tag' is not a stable semver tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, '386']
    defaults:
      run:
        working-directory: graal-rc
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: graal-rc/frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: graal-rc/go.mod
          cache: true
          cache-dependency-path: graal-rc/go.sum

      - name: Install Wails CLI and generate frontend assets
        shell: pwsh
        run: |
          $goBin = (go env GOBIN).Trim()
          if ([string]::IsNullOrWhiteSpace($goBin)) { $goBin = Join-Path (go env GOPATH).Trim() 'bin' }
          $env:PATH = "$goBin;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $goBin
          go install ("github.com/wailsapp/wails/v3/cmd/wails3@" + $env:WAILS_VERSION)
          npm ci --prefix frontend
          wails3 generate bindings -f '-tags production' -clean=true -ts -i
          npm run build --prefix frontend

      - name: Set release version in build metadata
        shell: pwsh
        run: node build/ci/set-version.mjs '${{ needs.version.outputs.version }}'

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path -LiteralPath (Join-Path $nsisDir 'makensis.exe'))) {
            choco install nsis --yes --no-progress
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir

      - name: Build Windows binary
        shell: pwsh
        run: pwsh -NoProfile -File build/ci/build-windows.ps1 -Architecture '${{ matrix.arch }}' -Version '${{ needs.version.outputs.version }}'

      - name: Build and validate NSIS installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force | Out-Null
          pwsh -NoProfile -File build/ci/validate-installer.ps1 -Architecture '${{ matrix.arch }}' -BinaryPath 'ci-artifacts/windows/${{ matrix.arch }}/graal-rc-windows-${{ matrix.arch }}.exe'

      - name: Normalize release artifact name
        shell: pwsh
        run: |
          $suffix = if ('${{ matrix.arch }}' -eq 'amd64') { 'x64' } else { 'x86' }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item "ci-artifacts/installers/${{ matrix.arch }}/graal-rc-${{ matrix.arch }}-installer.exe" "release/nullbornes-rc-windows-$suffix-installer.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: graal-rc/release/nullbornes-rc-windows-*.exe
          if-no-files-found: error
          retention-days: 14

  linux-amd64:
    name: Linux amd64 AppImage
    needs: version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: graal-rc
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: graal-rc/frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: graal-rc/go.mod
          cache: true
          cache-dependency-path: graal-rc/go.sum

      - name: Install Linux GUI dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2t64 pkg-config

      - name: Install build tools and frontend assets
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm ci --prefix frontend
          wails3 generate bindings -f '-tags production' -clean=true -ts -i
          npm run build --prefix frontend

      - name: Set release version in build metadata
        run: node build/ci/set-version.mjs "${{ needs.version.outputs.version }}"

      - name: Install AppImage tool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool.AppImage" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          cat > "$RUNNER_TEMP/appimagetool" <<'SCRIPT'
          #!/usr/bin/env bash
          exec "$RUNNER_TEMP/appimagetool.AppImage" --appimage-extract-and-run "$@"
          SCRIPT
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Build Linux AppImage
        env:
          CGO_ENABLED: '1'
        run: task linux:create:appimage ARCH=amd64 APPIMAGETOOL="$RUNNER_TEMP/appimagetool"

      - name: Normalize release artifact name
        run: |
          mkdir -p release
          cp bin/graal-rc-x86_64.AppImage release/nullbornes-rc-linux-x64.AppImage

      - name: Upload Linux amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: graal-rc/release/nullbornes-rc-linux-x64.AppImage
          if-no-files-found: error
          retention-days: 14

  linux-386:
    name: Linux 386 portable archive
    needs: version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: graal-rc
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: graal-rc/frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: graal-rc/go.mod
          cache: true
          cache-dependency-path: graal-rc/go.sum

      - name: Install Linux GUI toolchains
        working-directory: .
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386 pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI and frontend assets
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm ci --prefix frontend
          wails3 generate bindings -f '-tags production' -clean=true -ts -i
          npm run build --prefix frontend
          wails3 generate .desktop -name graal-rc -exec graal-rc -icon graal-rc -outputfile build/linux/graal-rc.desktop -categories 'Development;'

      - name: Switch to 32-bit GTK3 development libraries
        working-directory: .
        run: |
          sudo apt-get remove -y libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
          sudo apt-get autoremove -y
          sudo apt-get install -y libgtk-3-dev:i386 libwebkit2gtk-4.1-dev:i386

      - name: Set release version in build metadata
        run: node build/ci/set-version.mjs "${{ needs.version.outputs.version }}"

      - name: Build 32-bit Linux binary and portable archive
        env:
          GOOS: linux
          GOARCH: '386'
          CGO_ENABLED: '1'
          PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          set -euo pipefail
          modfile="$RUNNER_TEMP/go-386.mod"
          cp go.mod "$modfile"
          cp go.sum "$RUNNER_TEMP/go-386.sum"
          go mod edit -modfile="$modfile" '-replace=github.com/wailsapp/wails/v3=github.com/wailsapp/wails/v3@v3.0.0-alpha2.118'
          go mod download -modfile="$modfile" github.com/wailsapp/wails/v3@v3.0.0-alpha2.118
          wails_module="$(go env GOMODCACHE)/github.com/wailsapp/wails/v3@v3.0.0-alpha2.118"
          patched_wails_module="$RUNNER_TEMP/wails-v3-386"
          cp -R "$wails_module" "$patched_wails_module"
          chmod -R u+rwX "$patched_wails_module"
          sed -i \
            -e 's/C\.ulong(len(icon))/C.gsize(len(icon))/g' \
            -e 's/C\.ulong(len(img\.Pix))/C.gsize(len(img.Pix))/g' \
            -e 's/C\.long(len(js))/C.gssize(len(js))/g' \
            -e 's/C\.long(n)/C.gssize(n)/g' \
            "$patched_wails_module/pkg/application/linux_cgo_gtk3.go"
          go mod edit -modfile="$modfile" "-replace=github.com/wailsapp/wails/v3=$patched_wails_module"
          go build -modfile="$modfile" -tags production,gtk3 -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/graal-rc"
          mkdir -p release/graal-rc-linux-386/rclib/native/linux-386
          cp "$RUNNER_TEMP/graal-rc" release/graal-rc-linux-386/graal-rc
          cp rclib/native/linux-386/grclib.so release/graal-rc-linux-386/rclib/native/linux-386/grclib.so
          cp build/appicon.png release/graal-rc-linux-386/appicon.png
          cp build/linux/graal-rc.desktop release/graal-rc-linux-386/graal-rc.desktop
          tar -C release -czf release/nullbornes-rc-linux-x86.tar.gz graal-rc-linux-386
          rm -rf release/graal-rc-linux-386

      - name: Upload Linux 386 artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-386
          path: graal-rc/release/nullbornes-rc-linux-x86.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    needs: version
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            suffix: x64
          - arch: arm64
            suffix: arm64
    defaults:
      run:
        working-directory: graal-rc
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: graal-rc/frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: graal-rc/go.mod
          cache: true
          cache-dependency-path: graal-rc/go.sum

      - name: Install build tools and frontend assets
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm ci --prefix frontend
          wails3 generate bindings -f '-tags production' -clean=true -ts -i
          npm run build --prefix frontend

      - name: Set release version in build metadata
        run: node build/ci/set-version.mjs "${{ needs.version.outputs.version }}"

      - name: Build macOS bundle
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
          CGO_CFLAGS: ${{ matrix.arch == 'amd64' && '-arch x86_64 -mmacosx-version-min=12.0' || '-mmacosx-version-min=12.0' }}
          CGO_LDFLAGS: ${{ matrix.arch == 'amd64' && '-arch x86_64 -mmacosx-version-min=12.0' || '-mmacosx-version-min=12.0' }}
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          set -euo pipefail
          if [[ '${{ matrix.arch }}' == 'amd64' ]]; then
            go build -tags production -trimpath -buildvcs=false -ldflags='-w -s' -o bin/graal-rc .
          else
            task darwin:package ARCH=arm64
          fi
          if [[ '${{ matrix.arch }}' == 'amd64' ]]; then
            task darwin:create:app:bundle ARCH=amd64
          fi
          mkdir -p release
          tar -C bin -czf "release/nullbornes-rc-macos-${{ matrix.suffix }}.tar.gz" graal-rc.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: graal-rc/release/nullbornes-rc-macos-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release assets
    needs: [version, windows, linux-amd64, linux-386, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate release checksums
        working-directory: release
        run: sha256sum nullbornes-rc-* > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ needs.version.outputs.tag }}' release/nullbornes-rc-* release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Graal Remote Control ${{ needs.version.outputs.tag }}" \
            --notes "Cross-platform native matrix release for Windows x64/x86, Linux x64/386 and macOS x64/arm64." \
            --verify-tag
