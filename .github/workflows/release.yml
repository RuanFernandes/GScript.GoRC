name: release

# Manual release: build Windows x64, Linux x64 and macOS x64, then publish a
# GitHub release. Triggered from the Actions tab via "Run workflow". Pick a
# semver bump level (patch/minor/major) and the next tag is computed from the
# latest existing tag automatically — no manual `git tag` needed.
on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump (auto-computes next tag from the latest one)"
        required: true
        type: choice
        default: minor
        options:
          - patch   # 0.0.1
          - minor   # 0.1.0
          - major   # 1.0.0
      custom_tag:
        description: "Override: explicit tag (e.g. v1.2.3). Blank = use bump."
        required: false
        default: ""
      release_name:
        description: "Release title"
        required: true
        default: "Graal RC"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        required: true
        default: true
      make_latest:
        description: "Set as latest release"
        type: choice
        options:
          - "false"
          - "true"
        required: true
        default: "false"

permissions:
  contents: write # needed to push the computed tag and create the release

jobs:
  windows:
    name: Windows (amd64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: graal-rc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: graal-rc/frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.25.0"
          cache-dependency-path: graal-rc/go.sum
      - name: Install wails3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - name: Put Go bin on PATH
        shell: bash
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install task
        shell: bash
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Ensure NSIS present
        shell: pwsh
        run: |
          # Chocolatey installs NSIS to C:\Program Files (x86)\NSIS, but its PATH
          # update isn't visible to this step's shell, so resolve makensis by full
          # path and export the dir for later steps via GITHUB_PATH.
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            choco install nsis -y --no-progress --force
          }
          "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$nsisDir\makensis.exe" /VERSION
      - name: Build NSIS installer (amd64)
        shell: bash
        env:
          CGO_ENABLED: "0" # syscall loader — no C toolchain needed for Windows
        run: task windows:package
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: graal-rc/bin/*-installer.exe
          if-no-files-found: error

  linux-amd64:
    name: Linux x64 (AppImage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graal-rc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: graal-rc/frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.25.0"
          cache-dependency-path: graal-rc/go.sum
      - name: Install GTK4/WebKitGTK6 deps + libfuse2
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libadwaita-1-dev libfuse2t64 file zip pkg-config
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - name: Put Go bin on PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Fetch appimagetool
        run: |
          curl -sSL -o "$HOME/appimagetool" https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/appimagetool"
          "$HOME/appimagetool" --version
      - name: Build native binary (linux/amd64, CGO)
        env:
          CGO_ENABLED: "1"
        run: task linux:build
      - name: Assemble AppImage (bundles grclib.so)
        run: |
          set -e
          rm -rf bin/AppDir
          mkdir -p bin/AppDir/usr/bin
          cp bin/graal-rc bin/AppDir/usr/bin/
          cp rclib/grclib.so bin/AppDir/usr/bin/
          cp build/appicon.png bin/AppDir/graal-rc.png
          cat > bin/AppDir/graal-rc.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Graal Remote Control
          Exec=graal-rc
          Icon=graal-rc
          Categories=Development;
          DESKTOP
          cat > bin/AppDir/AppRun <<'RUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/graal-rc" "$@"
          RUN
          chmod +x bin/AppDir/AppRun
          "$HOME/appimagetool" bin/AppDir bin/graal-rc-amd64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: graal-rc/bin/graal-rc-amd64.AppImage
          if-no-files-found: error

  macos-amd64:
    name: macOS x64 (tarball)
    # macos-13 (Intel) runner pools are effectively gone from GitHub's free
    # tier — jobs sit in "queued" indefinitely. macos-14 is Apple Silicon and
    # always available, so we cross-compile to x86_64 via `clang -arch x86_64`
    # (Apple's SDK still ships the x86_64 slice). Produces a real amd64 binary
    # matching the x86_64 grclib.dylib; runs natively on Intel Macs and under
    # Rosetta on Apple Silicon.
    runs-on: macos-14
    defaults:
      run:
        working-directory: graal-rc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: graal-rc/frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.25.0"
          cache-dependency-path: graal-rc/go.sum
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - name: Put Go bin on PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Build frontend + bindings
        run: task common:build:frontend
      - name: Cross-build darwin/amd64 (CGO x86_64)
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-arch x86_64 -mmacosx-version-min=12.0"
          CGO_LDFLAGS: "-arch x86_64 -mmacosx-version-min=12.0"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o bin/graal-rc .
      - name: Bundle binary + grclib.dylib
        run: |
          set -e
          mkdir -p stage
          cp bin/graal-rc stage/
          cp rclib/grclib.dylib stage/
          # rclib resolves the lib by searching the binary's dir and parents,
          # so shipping them side-by-side is enough.
          tar -C stage -czf bin/graal-rc-darwin-amd64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-amd64
          path: graal-rc/bin/graal-rc-darwin-amd64.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, linux-amd64, macos-amd64]
    if: always() && (needs.windows.result == 'success' || needs.linux-amd64.result == 'success' || needs.macos-amd64.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + tags to read the latest tag
      - name: Compute release tag
        id: tag
        run: |
          set -euo pipefail
          custom="${{ github.event.inputs.custom_tag }}"
          if [ -n "$custom" ]; then
            tag="$custom"
          else
            latest=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
            base="${latest#v}"; [ -z "$base" ] && base="0.0.0"
            IFS='.' read -r MA MI PA <<<"$base"
            case "${{ github.event.inputs.level }}" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              patch) PA=$((PA+1)) ;;
              *) echo "bad level"; exit 1 ;;
            esac
            tag="v${MA}.${MI}.${PA}"
          fi
          echo "Computed tag: $tag"
          echo "name=$tag" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ github.event.inputs.release_name }}
          prerelease: ${{ github.event.inputs.prerelease }}
          make_latest: ${{ github.event.inputs.make_latest }}
          body: |
            Built from commit ${{ github.sha }} on `${{ github.ref_name }}` via manual dispatch.

            Targets:
            - Windows x64 (NSIS installer)
            - Linux x64 (AppImage)
            - macOS x64 (tarball: binary + grclib.dylib)

            Native grclib libs are bundled per platform.
          files: release/*
