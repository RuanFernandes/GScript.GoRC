name: release

# Manual release: build the supported common desktop targets and publish a
# GitHub release. The native grclib files currently shipped by the repository
# are x86_64-only, so these are Windows 10/11 x64, Linux x86_64 and macOS
# x86_64 (native Intel and Rosetta 2 on Apple Silicon). ARM64/386 artifacts
# must wait for matching native libraries; publishing a Go binary without them
# would produce an installer that cannot connect to Graal.
#
# Triggered from the Actions tab via "Run workflow". Pick a semver bump level
# (patch/minor/major) and the next tag is computed from the latest existing tag
# automatically — no manual `git tag` needed.
on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump (auto-computes next tag from the latest one)"
        required: true
        type: choice
        default: patch
        options:
          - patch   # 0.0.1
          - minor   # 0.1.0
          - major   # 1.0.0
      custom_tag:
        description: "Override: explicit tag (e.g. v1.2.3). Blank = use bump."
        required: false
        default: ""
      release_name:
        description: "Release title"
        required: true
        default: "Graal RC"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        required: true
        default: false
      make_latest:
        description: "Set as latest release"
        type: choice
        options:
          - "false"
          - "true"
        required: true
        default: "true"
      publish_release:
        description: "Create a GitHub release; false keeps downloadable artifacts only"
        type: boolean
        required: true
        default: true

permissions:
  contents: write # needed to push the computed tag and create the release
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve semver
        id: resolve
        shell: bash
        env:
          BUMP_LEVEL: ${{ inputs.level }}
          CUSTOM_TAG: ${{ inputs.custom_tag }}
        run: |
          set -euo pipefail
          version="${CUSTOM_TAG#v}"
          if [ -z "$version" ]; then
            latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 || true)
            base="${latest#v}"
            [ -z "$base" ] && base="0.0.0"
            if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Latest tag '$latest' is not a stable semver tag." >&2
              exit 1
            fi
            IFS='.' read -r major minor patch <<< "$base"
            case "$BUMP_LEVEL" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unsupported bump level: $BUMP_LEVEL" >&2; exit 1 ;;
            esac
            version="$major.$minor.$patch"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$version' must contain exactly three numeric components." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $version"

  windows:
    name: Windows (amd64)
    needs: version
    runs-on: windows-2022
    defaults:
      run:
        working-directory: graal-rc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: graal-rc/frontend/package-lock.json
      - name: Set release version in build metadata
        run: node build/ci/set-version.mjs "${{ needs.version.outputs.version }}"
      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.25.0"
          cache-dependency-path: graal-rc/go.sum
      - name: Install wails3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - name: Put Go bin on PATH
        shell: bash
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install task
        shell: bash
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Ensure NSIS present
        shell: pwsh
        run: |
          # Chocolatey installs NSIS to C:\Program Files (x86)\NSIS, but its PATH
          # update isn't visible to this step's shell, so resolve makensis by full
          # path and export the dir for later steps via GITHUB_PATH.
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            choco install nsis -y --no-progress --force
          }
          "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$nsisDir\makensis.exe" /VERSION
      - name: Build NSIS installer (amd64)
        shell: bash
        env:
          CGO_ENABLED: "0" # syscall loader — no C toolchain needed for Windows
        run: task windows:package
      - name: Normalize installer name
        shell: bash
        run: cp bin/graal-rc-amd64-installer.exe bin/nullbornes-rc-windows-x64-installer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: graal-rc/bin/nullbornes-rc-windows-x64-installer.exe
          if-no-files-found: error
          retention-days: 1

  linux-amd64:
    name: Linux x64 (AppImage)
    needs: version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: graal-rc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: graal-rc/frontend/package-lock.json
      - name: Set release version in build metadata
        run: node build/ci/set-version.mjs "${{ needs.version.outputs.version }}"
      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.25.0"
          cache-dependency-path: graal-rc/go.sum
      - name: Install GTK4/WebKitGTK6 deps + libfuse2
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libadwaita-1-dev libfuse2t64 file zip pkg-config
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - name: Put Go bin on PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Fetch appimagetool
        run: |
          curl -sSL -o "$HOME/appimagetool" https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/appimagetool"
          "$HOME/appimagetool" --version
      - name: Build AppImage with GTK/WebKit runtime and grclib.so
        env:
          CGO_ENABLED: "1"
        run: APPIMAGETOOL="$HOME/appimagetool" task linux:create:appimage
      - name: Normalize AppImage name
        run: cp bin/graal-rc-x86_64.AppImage bin/nullbornes-rc-linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: graal-rc/bin/nullbornes-rc-linux-x64.AppImage
          if-no-files-found: error
          retention-days: 1

  macos-amd64:
    name: macOS x64 (.app tarball)
    needs: version
    # macos-13 (Intel) runner pools are effectively gone from GitHub's free
    # tier — jobs sit in "queued" indefinitely. macos-14 is Apple Silicon and
    # always available, so we cross-compile to x86_64 via `clang -arch x86_64`
    # (Apple's SDK still ships the x86_64 slice). Produces a real amd64 binary
    # matching the x86_64 grclib.dylib; runs natively on Intel Macs and under
    # Rosetta on Apple Silicon.
    runs-on: macos-14
    defaults:
      run:
        working-directory: graal-rc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: graal-rc/frontend/package-lock.json
      - name: Set release version in build metadata
        run: node build/ci/set-version.mjs "${{ needs.version.outputs.version }}"
      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.25.0"
          cache-dependency-path: graal-rc/go.sum
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - name: Put Go bin on PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Build frontend + bindings
        run: task common:build:frontend
      - name: Generate macOS icon
        run: task common:generate:icons
      - name: Cross-build darwin/amd64 (CGO x86_64)
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-arch x86_64 -mmacosx-version-min=12.0"
          CGO_LDFLAGS: "-arch x86_64 -mmacosx-version-min=12.0"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o bin/graal-rc .
      - name: Create macOS application bundle
        run: task darwin:create:app:bundle
      - name: Verify ad-hoc signature
        run: codesign --verify --deep --strict --verbose=2 bin/graal-rc.app
      - name: Archive macOS application bundle
        run: |
          set -euo pipefail
          test -d bin/graal-rc.app
          test -f bin/graal-rc.app/Contents/Resources/icons.icns
          test -f bin/graal-rc.app/Contents/Frameworks/grclib.dylib
          test ! -e bin/graal-rc.app/Contents/Resources/Assets.car
          mkdir -p stage
          cp -R bin/graal-rc.app stage/
          tar -C stage -czf bin/graal-rc-darwin-amd64.tar.gz graal-rc.app
          cp bin/graal-rc-darwin-amd64.tar.gz bin/nullbornes-rc-macos-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: macos-amd64
          path: graal-rc/bin/nullbornes-rc-macos-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: [version, windows, linux-amd64, macos-amd64]
    if: ${{ always() && inputs.publish_release == true && needs.version.result == 'success' && needs.windows.result == 'success' && needs['linux-amd64'].result == 'success' && needs['macos-amd64'].result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + tags to read the latest tag
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          for artifact in \
            nullbornes-rc-windows-x64-installer.exe \
            nullbornes-rc-linux-x64.AppImage \
            nullbornes-rc-macos-x64.tar.gz; do
            source=$(find dist -type f -name "$artifact" -print -quit)
            test -n "$source"
            cp "$source" "release/$artifact"
          done
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ github.event.inputs.release_name }}
          prerelease: ${{ github.event.inputs.prerelease }}
          make_latest: ${{ github.event.inputs.make_latest }}
          body: |
            Version ${{ needs.version.outputs.version }} built from commit ${{ github.sha }} on `${{ github.ref_name }}` via manual dispatch.

            Targets:
            - Windows 10/11 x64 (NSIS installer)
            - Linux x86_64 (AppImage; choose language in Settings on first launch)
            - macOS x86_64 (.app tarball; native Intel and Rosetta 2 on Apple Silicon)

            GoRC stores the selected language in the platform user config directory,
            so the preference survives updates and is shared by all app windows.

            Native grclib libs are bundled per platform.
          files: release/*

  cleanup:
    name: Remove intermediate artifacts
    if: ${{ always() && inputs.publish_release == true }}
    needs: [release]
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Delete artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifact_ids < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.workflow_run.id == ${GITHUB_RUN_ID}) | .id"
          )

          for artifact_id in "${artifact_ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null
          done

          echo "Deleted ${#artifact_ids[@]} intermediate artifact(s) from run ${GITHUB_RUN_ID}."
