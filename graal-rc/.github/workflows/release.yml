name: release

# Manual release trigger: pick a bump level from the Actions UI ("Run workflow"
# → choose patch / minor / major). This computes the next semver tag from the
# latest existing tag, pushes it, and the `build` workflow's `tags: ['v*']`
# trigger then builds all 3 platforms and publishes the GitHub Release.
#
# Run from the Actions tab → "release" → Run workflow → main → pick level.

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch   # 0.0.1  — bugfix
          - minor   # 0.1.0  — new feature
          - major   # 1.0.0  — breaking change

permissions:
  contents: write   # needed to push the tag

jobs:
  bump:
    name: Tag ${{ github.event.inputs.level }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history + tags to read the latest tag

      - name: Compute next version
        id: next
        run: |
          set -euo pipefail
          # Latest tag like v1.2.3, sorted by version. Empty if none yet.
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          echo "Latest tag: ${latest:-<none>}"
          base="${latest#v}"
          if [ -z "$base" ]; then base="0.0.0"; fi

          IFS='.' read -r MA MI PA <<<"$base"
          case "${{ github.event.inputs.level }}" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
            *) echo "bad level"; exit 1 ;;
          esac
          next="v${MA}.${MI}.${PA}"
          echo "Next tag: $next"
          echo "tag=$next" >>"$GITHUB_OUTPUT"

      - name: Push tag
        run: |
          git tag "${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"
