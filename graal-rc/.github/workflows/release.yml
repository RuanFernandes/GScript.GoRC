name: Publish Graal RC release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0-alpha2.117
  TASK_VERSION: v3.40.1

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, '386']

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and build assets
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $goBin = (go env GOBIN).Trim()
          if ([string]::IsNullOrWhiteSpace($goBin)) { $goBin = Join-Path (go env GOPATH).Trim() 'bin' }
          Add-Content -Path $env:GITHUB_PATH -Value $goBin
          go install ("github.com/wailsapp/wails/v3/cmd/wails3@" + $env:WAILS_VERSION)
          wails3 generate bindings -f '-tags production' -clean=true -ts -i

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build Windows binary
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          pwsh -NoProfile -File build/ci/build-windows.ps1 -Architecture '${{ matrix.arch }}' -Version $version

      - name: Validate and package NSIS installer
        shell: pwsh
        run: pwsh -NoProfile -File build/ci/validate-installer.ps1 -Architecture '${{ matrix.arch }}' -BinaryPath 'ci-artifacts/windows/${{ matrix.arch }}/graal-rc-windows-${{ matrix.arch }}.exe'

      - name: Normalize release artifact name
        shell: pwsh
        run: |
          $suffix = if ('${{ matrix.arch }}' -eq 'amd64') { 'x64' } else { 'x86' }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item "ci-artifacts/installers/${{ matrix.arch }}/graal-rc-${{ matrix.arch }}-installer.exe" "release/nullbornes-rc-windows-$suffix-installer.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: release/nullbornes-rc-windows-*.exe
          if-no-files-found: error
          retention-days: 14

  linux-amd64:
    name: Linux amd64 AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools and frontend dependencies
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm ci --prefix frontend
          wails3 generate bindings -f '-tags production' -clean=true -ts -i
          npm run build --prefix frontend

      - name: Install AppImage tool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool.AppImage" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          cat > "$RUNNER_TEMP/appimagetool" <<'SCRIPT'
          #!/usr/bin/env bash
          exec "$RUNNER_TEMP/appimagetool.AppImage" --appimage-extract-and-run "$@"
          SCRIPT
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Build Linux AppImage
        env:
          CGO_ENABLED: '1'
        run: task linux:create:appimage ARCH=amd64 APPIMAGETOOL="$RUNNER_TEMP/appimagetool"

      - name: Normalize release artifact name
        run: |
          mkdir -p release
          cp bin/graal-rc-x86_64.AppImage release/nullbornes-rc-linux-x64.AppImage

      - name: Upload Linux amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: release/nullbornes-rc-linux-x64.AppImage
          if-no-files-found: error
          retention-days: 14

  linux-386:
    name: Linux 386 portable archive
    runs-on: ubuntu-24.04

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Install 32-bit Linux GUI toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386 pkg-config libgtk-4-dev:i386 libwebkitgtk-6.0-dev:i386 libgtk-3-dev:i386 libwebkit2gtk-4.1-dev:i386

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm ci --prefix frontend
          wails3 generate bindings -f '-tags production' -clean=true -ts -i
          npm run build --prefix frontend

      - name: Build 32-bit Linux binary and portable archive
        env:
          GOOS: linux
          GOARCH: '386'
          CGO_ENABLED: '1'
          CC: gcc
          CXX: g++
          PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          modfile="$RUNNER_TEMP/go-386.mod"
          cp go.mod "$modfile"
          cp go.sum "$RUNNER_TEMP/go-386.sum"
          go mod edit -modfile="$modfile" '-replace=github.com/wailsapp/wails/v3=github.com/wailsapp/wails/v3@v3.0.0-alpha2.118'
          go mod download -modfile="$modfile" github.com/wailsapp/wails/v3@v3.0.0-alpha2.118
          go build -modfile="$modfile" -tags production -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/graal-rc"
          wails3 generate .desktop -name graal-rc -exec graal-rc -icon graal-rc -outputfile build/linux/graal-rc.desktop -categories 'Development;'
          mkdir -p release/graal-rc-linux-386/rclib/native/linux-386
          cp "$RUNNER_TEMP/graal-rc" release/graal-rc-linux-386/graal-rc
          cp rclib/native/linux-386/grclib.so release/graal-rc-linux-386/rclib/native/linux-386/grclib.so
          cp build/appicon.png release/graal-rc-linux-386/appicon.png
          cp build/linux/graal-rc.desktop release/graal-rc-linux-386/graal-rc.desktop
          tar -C release -czf release/nullbornes-rc-linux-x86.tar.gz graal-rc-linux-386
          rm -rf release/graal-rc-linux-386

      - name: Upload Linux 386 artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-386
          path: release/nullbornes-rc-linux-x86.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
            suffix: x64
          - arch: arm64
            runner: macos-14
            suffix: arm64

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools and frontend dependencies
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm ci --prefix frontend
          wails3 generate bindings -f '-tags production' -clean=true -ts -i
          npm run build --prefix frontend

      - name: Build macOS bundle
        run: task darwin:package ARCH=${{ matrix.arch }}

      - name: Normalize release artifact name
        run: |
          mkdir -p release
          tar -C bin -czf "release/nullbornes-rc-macos-${{ matrix.suffix }}.tar.gz" graal-rc.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: release/nullbornes-rc-macos-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release assets
    needs: [windows, linux-amd64, linux-386, macos]
    runs-on: ubuntu-24.04

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate release checksums
        working-directory: release
        run: sha256sum nullbornes-rc-* > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release/nullbornes-rc-* release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Graal Remote Control v$version" \
            --generate-notes \
            --verify-tag
