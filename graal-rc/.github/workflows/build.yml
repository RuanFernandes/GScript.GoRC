name: build

# Builds graal-rc for the 3 desktop targets (windows / linux / darwin, all
# amd64) and — on a `v*` tag — publishes a GitHub Release with one archive
# per platform. Each archive bundles the binary next to its native grclib
# lib (grclib64.dll / grclib.so / grclib.dylib), because rclib resolves the
# lib by searching the binary's directory and its parents at runtime.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # release job needs this to create a release + upload assets

jobs:
  build:
    name: ${{ matrix.goos }}-amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            task: windows:build
            binary: graal-rc.exe
            lib: rclib/grclib64.dll
            archive: graal-rc-windows-amd64.zip
          - os: ubuntu-latest
            goos: linux
            task: linux:build
            binary: graal-rc
            lib: rclib/grclib.so
            archive: graal-rc-linux-amd64.tar.gz
          # macos-13 = Intel runner → native amd64 + CGO via system clang.
          # (macos-latest is Apple Silicon; cross-compiling darwin/amd64
          # there would need a cross C toolchain.)
          - os: macos-13
            goos: darwin
            task: darwin:build
            binary: graal-rc
            lib: rclib/grclib.dylib
            archive: graal-rc-darwin-amd64.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI deps (webkit2gtk for Wails CGO)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: graal-rc/go.mod
          cache-dependency-path: graal-rc/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: graal-rc/frontend/package-lock.json

      - name: Install Wails v3 CLI + Task
        working-directory: graal-rc
        env:
          WAILS_TAG: v3.0.0-alpha2.117
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_TAG}
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Build
        working-directory: graal-rc
        run: task ${{ matrix.task }}

      - name: Stage binary + native lib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          cp "graal-rc/bin/${{ matrix.binary }}" stage/
          cp "graal-rc/${{ matrix.lib }}" stage/
          ls -l stage

      - name: Archive (zip, Windows)
        if: matrix.goos == 'windows'
        run: Compress-Archive -Path stage\* -DestinationPath ${{ matrix.archive }}

      - name: Archive (tar.gz, Linux/macOS)
        if: matrix.goos != 'windows'
        run: tar -czf ${{ matrix.archive }} -C stage .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    # Only publish a release from a version tag. Branch/PR pushes still run
    # `build` above (artifacts visible in the run) but skip this job.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List release assets
        run: ls -l assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets/*
